services:
  - type: web
    name: forensicshield-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SAFE_MODE
        value: "true"
      - key: REAL_DEVICE_OPERATIONS
        value: "false"
      - key: ENABLE_BLOCKCHAIN_NOTARIZATION
        value: "false"
